version: "3"

vars:
  log: source scripts/utils.sh && _log
  error: source scripts/utils.sh && _error_handler
  qemu_os_arch:
    sh: 'uname -m | sed "s/arm64/aarch64/"'
  qemu_butane_user_name:
    sh: "whoami"
  qemu_butane_user_id:
    sh: "id -u"
  qemu_butane_hostname:
    sh: |
      if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
        echo "$(basename $(git rev-parse --show-toplevel))"
      else
        echo "$(basename "$PWD")"
      fi
  kcl_dataset:
    sh: |
      kcl .qemu/qemu.k .qemu/butane-render.k --format json \
        --argument qemu_butane_user_name='{{ .qemu_butane_user_name | lower }}' \
        --argument qemu_butane_user_id='{{ .qemu_butane_user_id }}' \
        --argument qemu_butane_hostname='{{ .qemu_butane_hostname | lower }}'
    cache: true
  qemu_uuid: "{{ ( .kcl_dataset | fromJson ).qemu.uuid }}"
  qemu_workspace: "{{ ( .kcl_dataset | fromJson ).qemu.workspace }}"
  qemu_os_name: "{{ ( .kcl_dataset | fromJson ).qemu.os.name }}"
  qemu_os_edition: "{{ ( .kcl_dataset | fromJson ).qemu.os.edition }}"
  qemu_os_version: "{{ ( .kcl_dataset | fromJson ).qemu.os.version }}"
  qemu_os_streams: "{{ ( .kcl_dataset | fromJson ).qemu.os.streams }}"
  qemu_checksum: "{{ index ( .kcl_dataset | fromJson ).qemu.checksum .qemu_os_arch }}"
  qemu_hardware_disk_unit: "{{ ( .kcl_dataset | fromJson ).qemu.hardware.disk.unit }}"
  qemu_hardware_disk_size: "{{ ( .kcl_dataset | fromJson ).qemu.hardware.disk.size }}"

tasks:
  init:
    desc: ""
    cmds:
      - task: generate-uuid
      - task: pull-image
      - task: extract-image
      - task: resize-image
      - task: build-butane
      - task: build-ignition

  clean:
    desc: ""
    cmds:
      - task: delete-workspace
      - task: delete-uuid
      - task: delete-ignition
      - task: delete-butane

  generate-uuid:
    desc: "Generate a persistent custom UUID file if it does not exist"
    internal: true
    silent: true
    deps: []
    status:
      - test -f .qemu/.uuid
    cmds:
      - |
        {{ .log }} "title" "create a qemu.uuid file with qemu vm uuid identifier"
        {{ .log }} "info" "echo "{{ .qemu_uuid }}" > .qemu/.uuid"
        if ! echo "{{ .qemu_uuid }}" > .qemu/.uuid; then {{ .error }} "failed to create .uuid"; fi
        {{ .log }} "success" "uuid file successfully created"

  pull-image:
    desc: "Download and check image signature and checksum"
    internal: true
    silent: true
    deps: []
    status:
      - echo "{{ .qemu_checksum }}  {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz" | shasum --check --algorithm 256
    cmds:
      - |
        {{ .log }} "title" "download {{ .qemu_os_name }} {{ .qemu_os_edition }} {{ .qemu_os_version }}"
        {{ .log }} "info" "if needed create directory \"{{ .qemu_uuid }}\""
        if [ ! -d "{{ .qemu_workspace }}" ]; then mkdir "{{ .qemu_workspace }}"; fi
        {{ .log }} "info" "curl --silent --location --fail --continue-at - --retry 5 --retry-delay 3 --output \"{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz\" \"https://builds.coreos.fedoraproject.org/prod/streams/{{ .qemu_os_streams }}/builds/{{ .qemu_os_version }}/{{ .qemu_os_arch }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-qemu.{{.qemu_os_arch}}.qcow2.xz\""
        curl --silent --location --fail --continue-at - --retry 5 --retry-delay 3 --output "{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz" "https://builds.coreos.fedoraproject.org/prod/streams/{{ .qemu_os_streams }}/builds/{{ .qemu_os_version }}/{{ .qemu_os_arch }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-qemu.{{.qemu_os_arch}}.qcow2.xz"
        {{ .log }} "info" "curl --silent --location --fail --retry 5 --output \"{{ .qemu_workspace }}/fedora.gpg" "https://fedoraproject.org/fedora.gpg\""
        curl --silent --location --fail --retry 5 --output "{{ .qemu_workspace }}/fedora.gpg" "https://fedoraproject.org/fedora.gpg"
        {{ .log }} "info" "curl --silent --location --fail --retry 5 --output \"{{ .qemu_workspace }}/fedora-coreos-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz.sig\" \"https://builds.coreos.fedoraproject.org/prod/streams/{{ .qemu_os_streams }}/builds/{{ .qemu_os_version }}/{{ .qemu_os_arch }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-qemu.{{.qemu_os_arch}}.qcow2.xz.sig\""
        curl --silent --location --fail --retry 5 --output "{{ .qemu_workspace }}/fedora-coreos-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz.sig" "https://builds.coreos.fedoraproject.org/prod/streams/{{ .qemu_os_streams }}/builds/{{ .qemu_os_version }}/{{ .qemu_os_arch }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-qemu.{{.qemu_os_arch}}.qcow2.xz.sig"
        {{ .log }} "info" "gpgv --keyring {{ .qemu_workspace }}/fedora.gpg {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz.sig {{ .qemu_workspace }}/fedora-coreos-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz"
        if ! gpgv --keyring {{ .qemu_workspace }}/fedora.gpg {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz.sig {{ .qemu_workspace }}/fedora-coreos-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz > /dev/null 2>&1; then {{ .error }} "gpg signature verification failed"; fi
        {{ .log }} "info" "echo \"{{ .qemu_checksum }}  {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz\" | shasum --check --algorithm 256"
        if ! echo "{{ .qemu_checksum }}  {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz" | shasum --check --algorithm 256 > /dev/null 2>&1; then {{ .error }} "checksum verification failed"; fi
        {{ .log }} "success" "image downloaded and verified successfully"

  extract-image:
    desc: "Extract .qcow2 image from archive if missing"
    internal: true
    silent: true
    deps: []
    status:
      - test -f "{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2"
    cmds:
      - |
        {{ .log }} "title" "extract {{ .qemu_os_name }} {{ .qemu_os_edition }} {{ .qemu_os_version }}"
        {{ .log }} "info" "unxz --keep --verbose {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz"
        if ! unxz --keep --verbose {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2.xz > /dev/null 2>&1; then {{ .error }} "checksum verification failed"; fi
        {{ .log }} "success" "image extracted"

  resize-image:
    desc: "Resize .qcow2 image"
    internal: true
    silent: true
    deps: []
    status:
      - test {{ .qemu_hardware_disk_size }} -eq $(qemu-img info {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2 --output=json | jq -r '."virtual-size" / 1024 / 1024 / 1024')
    cmds:
      - |
        {{ .log }} "title" "resize qemu disk"
        {{ .log }} "info" "qemu-img resize {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2 {{ .qemu_hardware_disk_size }}{{ .qemu_hardware_disk_unit }}"
        if ! qemu-img resize {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_os_arch }}.qcow2 {{ .qemu_hardware_disk_size }}{{ .qemu_hardware_disk_unit }} > /dev/null 2>&1; then {{ .error }} "qemu disk rezise failed"; fi
        {{ .log }} "success" "image extracted"

  build-butane:
    desc: "Compile Kcl config to Butane"
    internal: true
    silent: true
    deps: []
    sources:
      - ".qemu/config.k"
      - ".qemu/schema.k"
      - ".qemu/butane-render.k"
    generates:
      - ".qemu/config.bu"
    cmds:
      - |
        {{ .log }} "title" "build butane configuration"
        {{ .log }} "info" "kcl .qemu/qemu.k .qemu/butane-render.k --argument qemu_butane_user_name="{{ .qemu_butane_user_name }}" --argument qemu_butane_user_id="{{ .qemu_butane_user_id }}" --path_selector butane"
        if ! kcl .qemu/qemu.k .qemu/butane-render.k --argument qemu_butane_user_name="{{ .qemu_butane_user_name }}" --argument qemu_butane_user_id="{{ .qemu_butane_user_id }}" --path_selector butane > .qemu/config.bu; then {{ .error }} "butane config failed"; fi
        {{ .log }} "success" "butane config generated"

  build-ignition:
    desc: "Compile Butane config to Ignition"
    internal: true
    silent: true
    deps: []
    sources:
      - ".qemu/config.bu"
    generates:
      - ".qemu/config.ign"
    cmds:
      - |
        {{ .log }} "title" "build ignition configuration"
        {{ .log }} "info" "butane --strict .qemu/config.bu --output .qemu/config.ign"
        if !  butane --strict .qemu/config.bu --output .qemu/config.ign > /dev/null 2>&1; then {{ .error }} "ignition config failed"; fi
        {{ .log }} "success" "ignition config generated"

  delete-workspace:
    desc: "Remove qemu workspace"
    internal: true
    silent: true
    deps: []
    cmds:
      - |
        {{ .log }} "title" "delete workspace"
        {{ .log }} "info" "rm -rf {{ .qemu_workspace }}"
        if ! rm -rf {{ .qemu_workspace }}; then {{ .error }} "failed to delete workspace directory"; fi
        {{ .log }} "success" "workspace directory successfully deleted"

  delete-uuid:
    desc: "Remove uuid file"
    internal: true
    silent: true
    deps: []
    cmds:
      - |
        {{ .log }} "title" "delete qemu uuid file"
        {{ .log }} "info" "rm -rf .qemu/.uuid"
        if ! rm -rf .qemu/.uuid; then {{ .error }} "failed to delete qemu uuid file"; fi
        {{ .log }} "success" "qemu uuid file correctly deleted"

  delete-ignition:
    desc: "Remove ignition file"
    internal: true
    silent: true
    deps: []
    cmds:
      - |
        {{ .log }} "title" "delete ignition file"
        {{ .log }} "info" "rm -rf .qemu/config.ign"
        if ! rm -rf .qemu/config.ign; then {{ .error }} "failed to delete ignition file"; fi
        {{ .log }} "success" "ignition file correctly deleted"

  delete-butane:
    desc: "Remove butane file"
    internal: true
    silent: true
    deps: []
    cmds:
      - |
        {{ .log }} "title" "delete butane file"
        {{ .log }} "info" "rm -rf .qemu/config.bu"
        if ! rm -rf .qemu/config.bu; then {{ .error }} "failed to delete butane file"; fi
        {{ .log }} "success" "butane file correctly deleted"

