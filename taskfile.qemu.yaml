version: "3"

vars:
  log: source {{ .TASKFILE_DIR }}/scripts/utils.sh && _log
  error: source {{ .TASKFILE_DIR }}/scripts/utils.sh && _error_handler
  qemu_host_arch:
    sh: 'uname -m | sed "s/arm64/aarch64/"'
  qemu_host_os:
    sh: 'uname -s | tr "[:upper:]" "[:lower:]"'
  qemu_butane_user_name:
    sh: "whoami"
  qemu_butane_user_id:
    sh: "id -u"
  shasum_cmd:
    sh: 'command -v shasum || command -v sha256sum'
  kcl_dataset:
    sh: |
      kcl {{ .TASKFILE_DIR }}/config.k --format json \
        --argument taskfile_dir='{{ .TASKFILE_DIR }}' \
        --argument qemu_butane_user_name='{{ .qemu_butane_user_name | lower }}' \
        --argument qemu_butane_user_id='{{ .qemu_butane_user_id }}' \
        --argument qemu_host_arch='{{ .qemu_host_arch }}' \
        --argument qemu_host_os='{{ .qemu_host_os }}' \
        --argument github_token='{{ env "GITHUB_TOKEN" }}'
  qemu_uuid: "{{ ( .kcl_dataset | fromJson ).config.uuid }}"
  qemu_workspace: "{{ ( .kcl_dataset | fromJson ).config.workspace }}"
  qemu_os_name: "{{ ( .kcl_dataset | fromJson ).config.os.name }}"
  qemu_os_edition: "{{ ( .kcl_dataset | fromJson ).config.os.edition }}"
  qemu_os_version: "{{ ( .kcl_dataset | fromJson ).config.os.version }}"
  qemu_os_streams: "{{ ( .kcl_dataset | fromJson ).config.os.streams }}"
  qemu_checksum: "{{ index ( .kcl_dataset | fromJson ).config.checksum .qemu_host_arch }}"
  qemu_hardware_cpu: "{{ ( .kcl_dataset | fromJson ).config.hardware.cpu }}"
  qemu_hardware_memory_size: "{{ ( .kcl_dataset | fromJson ).config.hardware.memory.size }}"
  qemu_hardware_memory_unit: "{{ ( .kcl_dataset | fromJson ).config.hardware.memory.unit }}"
  qemu_hardware_disk_unit: "{{ ( .kcl_dataset | fromJson ).config.hardware.disk.unit }}"
  qemu_hardware_disk_size: "{{ ( .kcl_dataset | fromJson ).config.hardware.disk.size }}"
  qemu_command_binary: "{{ ( .kcl_dataset | fromJson ).config.command.binary }}"
  qemu_command_options: '{{ ( .kcl_dataset | fromJson ).config.command.options | join " " }}'
  qemu_github_token: '{{ ( .kcl_dataset | fromJson ).config.butane.github.token | default (env "GITHUB_TOKEN") }}'
  qemu_beszel_username:
    sh: 'echo "${BESZEL_USER:-$(mise env --json 2>/dev/null | jq -r ".BESZEL_USER // empty" 2>/dev/null || gopass show -o beszel/username 2>/dev/null || echo local@home.lan)}"'
  qemu_beszel_password:
    sh: 'echo "${BESZEL_PASSWORD:-$(mise env --json 2>/dev/null | jq -r ".BESZEL_PASSWORD // empty" 2>/dev/null || gopass show -o beszel/password 2>/dev/null || echo local@home.lan)}"'
  qemu_beszel_key:
    sh: 'echo "${BESZEL_KEY:-$(mise env --json 2>/dev/null | jq -r ".BESZEL_KEY // empty" 2>/dev/null || gopass show -o beszel/key 2>/dev/null || echo "")}"'
  qemu_beszel_local_url: 'http://localhost:{{ if (index ( .kcl_dataset | fromJson ).config.butane "beszel") }}{{ if ( .kcl_dataset | fromJson ).config.butane.beszel.url }}{{ ( .kcl_dataset | fromJson ).config.butane.beszel.url | splitList ":" | last }}{{ else }}8090{{ end }}{{ else }}8090{{ end }}'
  qemu_beszel_token:
    sh: |
      {{ if (index ( .kcl_dataset | fromJson ).config.butane "beszel") }}
      BESZEL_URL="{{ .qemu_beszel_local_url }}"
      BESZEL_USER="{{ .qemu_beszel_username }}"
      BESZEL_PASS="{{ .qemu_beszel_password }}"
      TOKEN_JSON=$(curl -s --max-time 5 -X POST "$BESZEL_URL/api/collections/_superusers/auth-with-password" -H "Content-Type: application/json" -d "{\"identity\": \"$BESZEL_USER\", \"password\": \"$BESZEL_PASS\"}" 2>/dev/null || true)
      AUTH_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token // empty' 2>/dev/null)
      if [ -z "$AUTH_TOKEN" ]; then exit 0; fi
      EXISTING=$(curl -s --max-time 5 "$BESZEL_URL/api/collections/universal_tokens/records" -H "Authorization: $AUTH_TOKEN" 2>/dev/null | jq -r '.items[0].token // empty' 2>/dev/null)
      if [ -n "$EXISTING" ]; then
        echo "$EXISTING"
      else
        NEW_TOKEN=$(cat /proc/sys/kernel/random/uuid 2>/dev/null || echo "beszel-$(date +%s)")
        USER_ID=$(curl -s --max-time 5 "$BESZEL_URL/api/collections/users/records" -H "Authorization: $AUTH_TOKEN" 2>/dev/null | jq -r '.items[0].id // empty' 2>/dev/null)
        curl -s --max-time 5 -X POST "$BESZEL_URL/api/collections/universal_tokens/records" -H "Authorization: $AUTH_TOKEN" -H "Content-Type: application/json" -d "{\"token\": \"$NEW_TOKEN\", \"user\": \"$USER_ID\"}" 2>/dev/null | jq -r '.token // empty' 2>/dev/null
      fi
      {{ end }}

tasks:
  check:
    desc: "QEMU : Confirm dependencies are meet"
    cmds:
      - task: check-qemu
      - task: check-butane
      - task: check-shasum
      - task: check-jq
      - task: check-kcl
      - task: check-curl
      - task: check-gpgv

  up:
    desc: "QEMU : Wake up the virtual machine"
    deps:
      - task: check
    cmds:
      - task: generate-uuid
      - task: create-workspace
      - task: pull-image
      - task: image-validation
      - task: extract-image
      - task: resize-image
      - task: build-butane
      - task: build-ignition
      - task: create-bridge
      - task: launch-vm
      - task: wait-ssh
      - task: wait-rpm-install
      - task: wait-topgrade
      - task: reboot
      - task: connect-ssh

  down:
    desc: "QEMU : Destroy the virtual machine"
    cmds:
      - task: stop-vm
        vars:
          force: "true"
      - task: delete-bridge
      - task: delete-beszel-system
      - task: delete-vm
      - task: delete-ignition
      - task: delete-butane

  status:
    desc: "QEMU : Get virtual machine status"
    cmds:
      - task: get-status

  ssh:
    desc: "QEMU : Connect virtual machine"
    cmds:
      - task: connect-ssh

  logs:
    desc: "QEMU : Get virtual machine logs"
    cmds:
      - task: get-logs

  mgmt:
    desc: "QEMU : Open Cockpit web management console"
    cmds:
      - task: launch-cockpit

  stop:
    desc: "QEMU : Stop the virtual machine"
    vars:
      force: '{{ default "false" .force }}'
    cmds:
      - task: stop-vm
        vars:
          force: "{{ .force }}"
      - task: delete-pid

  check-qemu:
    internal: true
    silent: true
    cmds:
      - |
        {{ .log }} "title" "check qemu binary"
        {{ .log }} "info" "command -v {{ .qemu_command_binary }}"
        if ! command -v {{ .qemu_command_binary }} > /dev/null 2>&1 ; then {{ .error }} "can't find \"{{ .qemu_command_binary }}\" binary" ; fi
        {{ .log }} "success" "\"{{ .qemu_command_binary }}\" binary available"

  check-butane:
    internal: true
    silent: true
    cmds:
      - |
        {{ .log }} "title" "check butane binary"
        {{ .log }} "info" "command -v butane"
        if ! command -v butane > /dev/null 2>&1 ; then {{ .error }} "can't find \"butane\" binary" ; fi
        {{ .log }} "success" "\"butane\" binary available"

  check-shasum:
    internal: true
    silent: true
    cmds:
      - |
        {{ .log }} "title" "check shasum binary"
        {{ .log }} "info" "command -v shasum || command -v sha256sum"
        if ! command -v {{ .shasum_cmd }} > /dev/null 2>&1 ; then {{ .error }} "can't find \"shasum\" or \"sha256sum\" binary" ; fi
        {{ .log }} "success" "\"{{ .shasum_cmd }}\" binary available"

  check-jq:
    internal: true
    silent: true
    cmds:
      - |
        {{ .log }} "title" "check jq binary"
        {{ .log }} "info" "command -v jq"
        if ! command -v jq > /dev/null 2>&1 ; then {{ .error }} "can't find \"jq\" binary" ; fi
        {{ .log }} "success" "\"jq\" binary available"

  check-kcl:
    internal: true
    silent: true
    cmds:
      - |
        {{ .log }} "title" "check kcl binary"
        {{ .log }} "info" "command -v kcl"
        if ! command -v kcl > /dev/null 2>&1 ; then {{ .error }} "can't find \"kcl\" binary" ; fi
        {{ .log }} "success" "\"kcl\" binary available"

  check-curl:
    internal: true
    silent: true
    cmds:
      - |
        {{ .log }} "title" "check curl binary"
        {{ .log }} "info" "command -v curl"
        if ! command -v curl > /dev/null 2>&1 ; then {{ .error }} "can't find \"curl\" binary" ; fi
        {{ .log }} "success" "\"curl\" binary available"

  check-gpgv:
    internal: true
    silent: true
    cmds:
      - |
        {{ .log }} "title" "check gpgv binary"
        {{ .log }} "info" "command -v gpgv"
        if ! command -v gpgv > /dev/null 2>&1 ; then {{ .error }} "can't find \"gpgv\" binary" ; fi
        {{ .log }} "success" "\"gpgv\" binary available"

  generate-uuid:
    internal: true
    silent: true
    status:
      - test -f {{ .TASKFILE_DIR }}/.uuid
    cmds:
      - |
        {{ .log }} "title" "create an uuid file for qemu identifier"
        {{ .log }} "info" "echo "{{ .qemu_uuid }}" > {{ .TASKFILE_DIR }}/.uuid"
        if ! echo "{{ .qemu_uuid }}" > {{ .TASKFILE_DIR }}/.uuid ; then {{ .error }} "failed to create .uuid file" ; fi
        {{ .log }} "success" ".uuid file successfully created"

  create-workspace:
    internal: true
    silent: true
    status:
      - test -d "{{ .qemu_workspace }}"
    cmds:
      - |
        {{ .log }} "title" "create workspace"
        {{ .log }} "info" "mkdir -p \"{{ .qemu_workspace }}\""
        if ! mkdir -p "{{ .qemu_workspace }}" ; then {{ .error }} "directory \"{{ .qemu_workspace }}\" has not been created"; fi
        {{ .log }} "success" "workspace directory created"

  pull-image:
    internal: true
    silent: true
    status:
      - echo "{{ .qemu_checksum }}  {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz" | {{ .shasum_cmd }} --check
    cmds:
      - |
        {{ .log }} "title" "pull qemu image"
        EXPECTED_FILE="{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz"
        for f in "{{ .qemu_workspace }}"/*.qcow2.xz; do \
            if [ -f "$$f" ] && [ "$$(basename "$$f")" != "$$EXPECTED_FILE" ]; then \
                {{ .log }} "warning" "Found outdated base image: $$(basename "$$f"). Deleting." ; \
                rm -f "$$f" "$${f}.sig" "{{ .qemu_workspace }}/fedora.gpg" ; \
            fi; \
        done
        OUTPUT="{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz"
        URL="https://builds.coreos.fedoraproject.org/prod/streams/{{ .qemu_os_streams }}/builds/{{ .qemu_os_version }}/{{ .qemu_host_arch }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-qemu.{{.qemu_host_arch}}.qcow2.xz"
        {{ .log }} "info" "curl --silent --location --fail --retry 5 --output \"$OUTPUT\" \"$URL\""
        if ! curl --silent --location --fail --retry 5 --output "$OUTPUT" "$URL" ; then {{ .error }} "faild to download \"$URL\" to \"$OUTPUT\""; fi
        {{ .log }} "success" "image downloaded successfully"

  image-validation:
    internal: true
    silent: true
    status:
      - test -f "{{ .qemu_workspace }}/fedora.gpg"
      - test -f "{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz.sig"
      - gpgv --keyring "{{ .qemu_workspace }}/fedora.gpg" "{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz.sig" "{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz"
      - echo "{{ .qemu_checksum }}  {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz" | {{ .shasum_cmd }} --check
    cmds:
      - |
        {{ .log }} "title" "check qemu image"
        OUTPUT="{{ .qemu_workspace }}/fedora.gpg"
        URL="https://fedoraproject.org/fedora.gpg"
        {{ .log }} "info" "curl --silent --location --fail --retry 5 --output \"$OUTPUT\" \"$URL\""
        if ! curl --silent --location --fail --retry 5 --output "$OUTPUT" "$URL" ; then {{ .error }} "faild to download \"$URL\" to \"$OUTPUT\""; fi
        OUTPUT="{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz.sig"
        URL="https://builds.coreos.fedoraproject.org/prod/streams/{{ .qemu_os_streams }}/builds/{{ .qemu_os_version }}/{{ .qemu_host_arch }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-qemu.{{.qemu_host_arch}}.qcow2.xz.sig"
        {{ .log }} "info" "curl --silent --location --fail --retry 5 --output \"$OUTPUT\" \"$URL\""
        if ! curl --silent --location --fail --retry 5 --output "$OUTPUT" "$URL" ; then {{ .error }} "faild to download \"$URL\" to \"$OUTPUT\""; fi
        KEYRING="{{ .qemu_workspace }}/fedora.gpg"
        SIG="{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz.sig"
        QCOW2="{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz"
        {{ .log }} "info" "gpgv --keyring \"$KEYRING\" \"$SIG\" \"$QCOW2\""
        if ! gpgv --keyring "$KEYRING" "$SIG" "$QCOW2" > /dev/null 2>&1; then {{ .error }} "gpg signature verification failed"; fi
        {{ .log }} "info" "echo "{{ .qemu_checksum }}  $QCOW2" | {{ .shasum_cmd }} --check"
        if ! echo "{{ .qemu_checksum }}  $QCOW2" | {{ .shasum_cmd }} --check > /dev/null 2>&1; then {{ .error }} "checksum verification failed"; fi
        {{ .log }} "success" "image is valid"

  extract-image:
    internal: true
    silent: true
    status:
      - test -f "{{ .qemu_workspace }}/qemu.qcow2"
    cmds:
      - |
        {{ .log }} "title" "extract image"
        {{ .log }} "info" "unxz --keep {{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz"
        if ! unxz --keep "{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2.xz" > /dev/null 2>&1; then {{ .error }} "extraction failed"; fi
        {{ .log }} "info" "mv \"{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2\" \"{{ .qemu_workspace }}/qemu.qcow2\""
        mv "{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2" "{{ .qemu_workspace }}/qemu.qcow2"
        {{ .log }} "success" "image extracted and renamed to qemu.qcow2"

  resize-image:
    internal: true
    silent: true
    cmds:
      - |
        {{ .log }} "title" "check and resize qemu disk"
        DISK_PATH="{{ .qemu_workspace }}/qemu.qcow2"
        TARGET_SIZE={{ .qemu_hardware_disk_size }}
        if ! CURRENT_SIZE_BYTES=$(qemu-img info -U --output=json "$DISK_PATH" | jq -e '.["virtual-size"]' 2>/dev/null); then
           {{ .log }} "warning" "could not determine disk size. skipping resize check."
           exit 0
        fi
        CURRENT_SIZE=$(( CURRENT_SIZE_BYTES / 1024 / 1024 / 1024 ))
        if [ "$CURRENT_SIZE" -eq "$TARGET_SIZE" ]; then
          {{ .log }} "success" "disk size is already correct (${CURRENT_SIZE}G)"
          exit 0
        fi
        if [ "$CURRENT_SIZE" -gt "$TARGET_SIZE" ]; then
          {{ .log }} "warning" "cannot shrink disk (Current: ${CURRENT_SIZE}G, Target: ${TARGET_SIZE}G). skipping."
          exit 0
        fi
        {{ .log }} "info" "qemu-img resize \"$DISK_PATH\" ${TARGET_SIZE}{{ .qemu_hardware_disk_unit }}"
        if ! qemu-img resize "$DISK_PATH" ${TARGET_SIZE}{{ .qemu_hardware_disk_unit }} > /dev/null 2>&1; then
          {{ .error }} "qemu disk resize failed"
        fi
        {{ .log }} "success" "disk resized successfully"

  build-butane:
    internal: true
    silent: true
    sources:
      - "{{ .TASKFILE_DIR }}/config.k"
      - "{{ .TASKFILE_DIR }}/schema.k"
      - "{{ .TASKFILE_DIR }}/butane-render.k"
    generates:
      - "{{ .TASKFILE_DIR }}/config.bu"
    cmds:
      - |
        {{ .log }} "title" "build butane"
        {{ .log }} "info" "kcl {{ .TASKFILE_DIR }}/butane-render.k --argument qemu_butane_user_name='{{ .qemu_butane_user_name }}' --argument qemu_butane_user_id='{{ .qemu_butane_user_id }}' --argument github_token='{{ .qemu_github_token }}' --argument beszel_token='{{ .qemu_beszel_token }}' --argument beszel_key='{{ .qemu_beszel_key }}' --path_selector butane"
        if ! kcl {{ .TASKFILE_DIR }}/butane-render.k --argument qemu_butane_user_name='{{ .qemu_butane_user_name }}' --argument qemu_butane_user_id='{{ .qemu_butane_user_id }}' --argument github_token='{{ .qemu_github_token }}' --argument beszel_token='{{ .qemu_beszel_token }}' --argument beszel_key='{{ .qemu_beszel_key }}' --path_selector butane > {{ .TASKFILE_DIR }}/config.bu; then {{ .error }} "butane config failed"; fi
        {{ .log }} "success" "butane configuration generated"

  build-ignition:
    internal: true
    silent: true
    sources:
      - "{{ .TASKFILE_DIR }}/config.bu"
    generates:
      - "{{ .TASKFILE_DIR }}/config.ign"
    cmds:
      - |
        {{ .log }} "title" "build ignition"
        {{ .log }} "info" "butane --strict {{ .TASKFILE_DIR }}/config.bu --output {{ .TASKFILE_DIR }}/config.ign"
        if !  butane --strict {{ .TASKFILE_DIR }}/config.bu --output {{ .TASKFILE_DIR }}/config.ign > /dev/null 2>&1; then {{ .error }} "ignition config failed"; fi
        {{ .log }} "success" "ignition configuration generated"

  delete-vm:
    internal: true
    silent: true
    status:
      - test ! -f "{{ .qemu_workspace }}/qemu.qcow2"
      - test ! -f "{{ .qemu_workspace }}/qemu.pid"
      - test ! -f "{{ .qemu_workspace }}/qemu.log"
    cmds:
      - |
        {{ .log }} "title" "delete VM files"
        {{ .log }} "info" "sudo rm -f \"{{ .qemu_workspace }}/qemu.qcow2\""
        if ! sudo rm -f "{{ .qemu_workspace }}"/qemu.qcow2; then {{ .error }} "failed to delete disk file"; fi
        {{ .log }} "info" "sudo rm -f \"{{ .qemu_workspace }}/qemu.qcow2\""
        if ! sudo rm -f "{{ .qemu_workspace }}"/qemu.pid; then {{ .error }} "failed to delete pid file"; fi
        {{ .log }} "info" "sudo rm -f \"{{ .qemu_workspace }}/qemu.log\""
        if ! sudo rm -f "{{ .qemu_workspace }}"/qemu.log; then {{ .error }} "failed to delete log file"; fi
        {{ .log }} "success" "virtual machine files deleted"

  delete-beszel-system:
    internal: true
    silent: true
    status:
      - '! curl -s --max-time 2 "{{ .qemu_beszel_local_url }}/api/health" | jq -e ".code == 200" >/dev/null 2>&1'
    cmds:
      - |
        {{ .log }} "title" "clean up beszel system entries"
        TOKEN_JSON=$(curl -s --max-time 5 -X POST "{{ .qemu_beszel_local_url }}/api/collections/_superusers/auth-with-password" \
          -H "Content-Type: application/json" \
          -d "{\"identity\": \"{{ .qemu_beszel_username }}\", \"password\": \"{{ .qemu_beszel_password }}\"}" 2>/dev/null || true)
        AUTH_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token // empty' 2> /dev/null || true)
        if [ -z "$AUTH_TOKEN" ]; then
          {{ .log }} "warning" "failed to authenticate with beszel hub... skipping deletion."
          exit 0
        fi
        SYSTEMS_JSON=$(curl -s --max-time 5 -X GET "{{ .qemu_beszel_local_url }}/api/collections/systems/records" -H "Authorization: $AUTH_TOKEN" 2>/dev/null || true)
        SYSTEM_IDS=$(echo "$SYSTEMS_JSON" | jq -r --arg name "{{ .qemu_uuid }}" '.items[] | select(.name == $name) | .id' 2>/dev/null || true)
        for sid in $SYSTEM_IDS; do
          {{ .log }} "info" "curl -s --max-time 5 -X DELETE \"{{ .qemu_beszel_local_url }}/api/collections/systems/records/$sid\" -H \"Authorization: $AUTH_TOKEN\" >/dev/null 2>&1 || true"
          curl -s --max-time 5 -X DELETE "{{ .qemu_beszel_local_url }}/api/collections/systems/records/$sid" -H "Authorization: $AUTH_TOKEN" >/dev/null 2>&1 || true
        done
        {{ .log }} "success" "beszel system entries cleaned up successfully."

  delete-uuid:
    internal: true
    silent: true
    status:
      - test ! -f "{{ .TASKFILE_DIR }}/.uuid"
    cmds:
      - |
        {{ .log }} "title" "delete .uuid file"
        {{ .log }} "info" "rm -f {{ .TASKFILE_DIR }}/.uuid"
        if ! rm -f "{{ .TASKFILE_DIR }}/.uuid"; then {{ .error }} "failed to delete \"{{ .TASKFILE_DIR }}/.uuid\" file"; fi
        {{ .log }} "success" ".uuid file deleted"

  delete-ignition:
    internal: true
    silent: true
    status:
      - test ! -f "{{ .TASKFILE_DIR }}/config.ign"
    cmds:
      - |
        {{ .log }} "title" "delete ignition file"
        {{ .log }} "info" "rm -f {{ .TASKFILE_DIR }}/config.ign"
        if ! rm -f "{{ .TASKFILE_DIR }}/config.ign"; then {{ .error }} "failed to delete \"{{ .TASKFILE_DIR }}/config.ign\" file"; fi
        {{ .log }} "success" "ignition file deleted"

  delete-butane:
    internal: true
    silent: true
    status:
      - test ! -f "{{ .TASKFILE_DIR }}/config.bu"
    cmds:
      - |
        {{ .log }} "title" "delete butane file"
        {{ .log }} "info" "rm -f {{ .TASKFILE_DIR }}/config.bu"
        if ! rm -f "{{ .TASKFILE_DIR }}/config.bu"; then {{ .error }} "failed to delete \"{{ .TASKFILE_DIR }}/config.bu\" file"; fi
        {{ .log }} "success" "butane file deleted"

  delete-pid:
    internal: true
    silent: true
    status:
      - test ! -f "{{ .qemu_workspace }}/qemu.pid"
    cmds:
      - |
        {{ .log }} "title" "clean stale pid file"
        {{ .log }} "info" "rm -f {{ .qemu_workspace }}/qemu.pid"
        if ! sudo rm -f "{{ .qemu_workspace }}/qemu.pid"; then {{ .error }} "failed to delete \"{{ .qemu_workspace }}/qemu.pid\" file"; fi
        {{ .log }} "success" "stale pid file deleted"

  create-bridge:
    internal: true
    silent: true
    status:
      - '[ "{{ .qemu_host_os }}" != "linux" ] || nmcli -t -f GENERAL.STATE connection show br-qemu 2>/dev/null | grep -q activated'
    cmds:
      - |
        {{ .log }} "title" "activate bridge network"
        {{ .log }} "info" "sudo nmcli connection up br-qemu"
        if ! sudo nmcli connection up br-qemu > /dev/null 2>&1; then {{ .error }} "failed to activate br-qemu bridge"; fi
        {{ .log }} "success" "br-qemu bridge activated"

  delete-bridge:
    internal: true
    silent: true
    status:
      - '[ "{{ .qemu_host_os }}" != "linux" ] || ! nmcli -t -f GENERAL.STATE connection show br-qemu 2>/dev/null | grep -q activated'
    cmds:
      - |
        {{ .log }} "title" "deactivate bridge network"
        {{ .log }} "info" "sudo nmcli connection down br-qemu"
        sudo nmcli connection down br-qemu > /dev/null 2>&1 || true
        {{ .log }} "success" "br-qemu bridge deactivated"

  launch-vm:
    internal: true
    silent: true
    status:
      - task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status | jq -e '.status == "running"' > /dev/null
    cmds:
      - |
        {{ .log }} "title" "launch virtual machine"
        {{ .log }} "info" "sudo {{ .qemu_command_binary }} {{ .qemu_command_options }}"
        sudo {{ .qemu_command_binary }} {{ .qemu_command_options }}
        {{ .log }} "success" "virtual machine started"

  wait-ssh:
    internal: true
    silent: true
    status:
      - task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status | jq -e '.status != "running"' > /dev/null
    cmds:
      - |
        {{ .log }} "title" "wait ssh accessible"
        TIMEOUT=30
        COUNTER=0
        {{ .log }} "info" "until ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local exit 2> /dev/null; do..."
        until ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local exit 2> /dev/null; do
        sleep 1
          COUNTER=$((COUNTER + 1))
          if [ $COUNTER -gt $TIMEOUT ]; then
            {{ .error }} "timeout: SSH server not reachable after ${TIMEOUT}s"
            exit 1
          fi
        done
        {{ .log }} "success" "ssh server is ready and accepting connections"

  wait-rpm-install:
    internal: true
    silent: true
    status:
      - task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status | jq -e '.status != "running"' > /dev/null
    cmds:
      - |
        {{ .log }} "title" "wait rpm packages installation"
        TIMEOUT=180
        COUNTER=0
        {{ .log }} "info" "until ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local \"systemctl is-active install-system-pkgs.service > /dev/null || systemctl is-failed install-system-pkgs.service > /dev/null\" 2> /dev/null; do..."
        until ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local "systemctl is-active install-system-pkgs.service > /dev/null || systemctl is-failed install-system-pkgs.service > /dev/null" 2> /dev/null; do
          sleep 1
          COUNTER=$((COUNTER + 1))
          if [ $COUNTER -gt $TIMEOUT ]; then
            {{ .error }} "timeout: rpm installation taking too long after ${TIMEOUT}s"
            exit 1
          fi
        done
        if ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local "systemctl is-failed install-system-pkgs.service >/dev/null" 2> /dev/null; then
          {{ .error }} "rpm installation service FAILED. Check logs with: ssh {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local 'sudo journalctl -u install-system-pkgs.service'"
          exit 1
        fi
        {{ .log }} "success" "rpm installation completed successfully"

  wait-topgrade:
    internal: true
    silent: true
    status:
      - task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status | jq -e '.status != "running"' > /dev/null
    cmds:
      - |
        {{ .log }} "title" "wait topgrade updates virtual machine"
        TIMEOUT=300
        COUNTER=0
        {{ .log }} "info" "until ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local \"systemctl is-active run-topgrade.service > /dev/null || systemctl is-failed run-topgrade.service > /dev/null\" 2> /dev/null; do..."
        until ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local "systemctl is-active run-topgrade.service > /dev/null || systemctl is-failed run-topgrade.service > /dev/null" 2> /dev/null; do
          sleep 1
          COUNTER=$((COUNTER + 1))
          if [ $COUNTER -gt $TIMEOUT ]; then
            {{ .error }} "timeout: topgrade taking too long after ${TIMEOUT}s"
            exit 1
          fi
        done
        if ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local "systemctl is-failed run-topgrade.service >/dev/null" 2> /dev/null; then
          {{ .error }} "topgrade service FAILED. Check logs with: ssh {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local 'sudo journalctl -u run-topgrade.service'"
          exit 1
        fi
        {{ .log }} "success" "topgrade completed successfully"

  reboot:
    internal: true
    silent: true
    vars:
      force: '{{ default "false" .force }}'
    status:
      - task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status | jq -e '.status != "running"' > /dev/null
    cmds:
      - |
        {{ .log }} "title" "check for staged updates and reboot if needed"
        REBOOT_NEEDED="false"
        if [ "{{ .force }}" = "true" ]; then
          REBOOT_NEEDED="true"
          {{ .log }} "warning" "forced reboot requested"
        elif ssh -o LogLevel=ERROR -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local "rpm-ostree status --json" | jq -e '.deployments[0].booted == false' >/dev/null 2>&1; then
          REBOOT_NEEDED="true"
          {{ .log }} "warning" "staged updates detected reboot is required"
        fi
        if [ "$REBOOT_NEEDED" = "true" ]; then
          {{ .log }} "info" "ssh -o LogLevel=ERROR -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local \"sudo systemctl reboot\""
          ssh -o LogLevel=ERROR -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local "sudo systemctl reboot" 2>/dev/null || true
          sleep 1
          TIMEOUT=45
          COUNTER=0
          {{ .log }} "info" "until ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local exit 2> /dev/null; do..."
          until ssh -q -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local exit 2> /dev/null; do
            sleep 1
            COUNTER=$((COUNTER + 1))
            if [ $COUNTER -gt $TIMEOUT ]; then
              {{ .error }} "timeout: ssh server not reachable after reboot"
              exit 1
            fi
          done
          {{ .log }} "success" "virtual machine successfully rebooted and back online"
        else
          {{ .log }} "success" "no staged updates. no reboot needed"
        fi

  get-status:
    internal: true
    silent: true
    cmds:
      - |
        STATE="stopped"
        PID_FILE="{{ .qemu_workspace }}/qemu.pid"
        PID=""
        if [ -f "$PID_FILE" ]; then
          PID=$(sudo cat "$PID_FILE")
          if sudo kill -0 "$PID" 2> /dev/null; then
            STATE="running"
          else
            STATE="crashed"
          fi
        fi
        printf '{"id":"%s","status":"%s","pid":"%s","config":{"memory":"%s","cpu":"%s","image":"%s"}}\n' \
          "{{ .qemu_uuid }}" \
          "$STATE" \
          "$PID" \
          "{{ .qemu_hardware_memory_size }}{{ .qemu_hardware_memory_unit }}" \
          "{{ .qemu_hardware_cpu }}" \
          "{{ .qemu_workspace }}/{{ .qemu_os_name }}-{{ .qemu_os_edition }}-{{ .qemu_os_version }}-{{ .qemu_host_arch }}.qcow2"

  connect-ssh:
    internal: true
    silent: true
    status:
      - task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status | jq -e '.status != "running"' > /dev/null
    cmds:
      - |
        {{ .log }} "title" "connect virtual machine using ssh"
        STATE=$(task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status | jq -r '.status')
        if [ "$STATE" != "running" ]; then
          {{ .log }} "error" "QEMU virtual machine is not started."
          exit 1
        fi
        {{ .log }} "info" "ssh -o LogLevel=ERROR -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local"
        ssh -o LogLevel=ERROR -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local

  get-logs:
    internal: true
    silent: true
    preconditions:
      - sh: test -f "{{ .qemu_workspace }}/qemu.log"
        msg: "'{{ .qemu_workspace }}/qemu.log' file is missing."
    cmds:
      - |
        {{ .log }} "title" "tail virtual machine logs"
        {{ .log }} "info" "tail -f {{ .qemu_workspace }}/qemu.log"
        tail -f {{ .qemu_workspace }}/qemu.log

  stop-vm:
    internal: true
    silent: true
    status:
      - task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status | jq -e '.status != "running"' > /dev/null
    vars:
      force: '{{ default "false" .force }}'
    cmds:
      - |
        {{ .log }} "title" "stop virtual machine"
        JSON_OUTPUT=$(task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status)
        STATE=$(echo "$JSON_OUTPUT" | jq -r '.status')
        PID=$(echo "$JSON_OUTPUT" | jq -r '.pid')
        if [ "$STATE" == "running" ]; then
          if [ "{{ .force }}" == "true" ]; then
            {{ .log }} "info" "sudo kill -9 "$PID" 2> /dev/null || true"
            sudo kill -9 "$PID" 2> /dev/null || true
          else
            {{ .log }} "info" "ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local \"sudo systemctl poweroff\" 2> /dev/null || ({{ .log }} \"warning" "SSH unreachable, falling back to SIGTERM...\" && sudo kill \"$PID\")"
            ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ .qemu_butane_user_name }}@{{ .qemu_uuid }}.local "sudo systemctl poweroff" 2> /dev/null || ({{ .log }} "warning" "SSH unreachable, falling back to SIGTERM..." && sudo kill "$PID")
            TIMEOUT=20
            COUNTER=0
            while sudo kill -0 "$PID" 2> /dev/null; do
              sleep 1
              COUNTER=$((COUNTER + 1))
              if [ $COUNTER -gt $TIMEOUT ]; then
                {{ .log }} "info" "sudo kill -9 "$PID" 2> /dev/null || true"
                sudo kill -9 "$PID" 2> /dev/null || true
                break
              fi
            done
          fi
          {{ .log }} "success" "VM stopped."
        fi

  launch-cockpit:
    internal: true
    silent: true
    status:
      - task -t {{ .TASKFILE_DIR }}/taskfile.qemu.yaml status | jq -e '.status != "running"' > /dev/null
    cmds:
      - |
        {{ .log }} "title" "opening Cockpit web console: https://{{ .qemu_uuid }}.local:9090"
        if [ "{{ .qemu_host_os }}" = "darwin" ]; then
          open "https://{{ .qemu_uuid }}.local:9090"
        else
          xdg-open "https://{{ .qemu_uuid }}.local:9090" 2>/dev/null || {{ .log }} "warning" "could not open browser. Please navigate to https://{{ .qemu_uuid }}.local:9090"
        fi
